name: Agents Studio sync verification
on:
  push:
    branches: [sync/20261106-2f35eb108]
permissions:
  contents: read
concurrency:
  group: as-sync-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        include:
          - label: typecheck-build
            command: "node scripts/typecheck-low-memory.mjs\npnpm build"
          - label: server-0
            command: "pnpm test:run:general -- --group general-server-without-chat --shard-index 0 --shard-count 4"
          - label: server-1
            command: "pnpm test:run:general -- --group general-server-without-chat --shard-index 1 --shard-count 4"
          - label: server-2
            command: "pnpm test:run:general -- --group general-server-without-chat --shard-index 2 --shard-count 4"
          - label: server-3
            command: "pnpm test:run:general -- --group general-server-without-chat --shard-index 3 --shard-count 4"
          - label: serialized-0
            command: "pnpm test:run:serialized -- --shard-index 0 --shard-count 2"
          - label: serialized-1
            command: "pnpm test:run:serialized -- --shard-index 1 --shard-count 2"
          - label: workspaces-a-0
            command: "pnpm test:run:general -- --group general-workspaces-a --shard-index 0 --shard-count 2"
          - label: workspaces-a-1
            command: "pnpm test:run:general -- --group general-workspaces-a --shard-index 1 --shard-count 2"
          - label: workspaces-b
            command: "pnpm test:run:general -- --group general-workspaces-b"
          - label: workspaces-c
            command: "pnpm test:run:general -- --group general-workspaces-c"
          - label: chat-0
            command: "pnpm test:run:general -- --group general-chat --shard-index 0 --shard-count 2"
          - label: chat-1
            command: "pnpm test:run:general -- --group general-chat --shard-index 1 --shard-count 2"
    env:
      PAPERCLIP_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      PAPERCLIP_TEST_POSTGRES_RESERVED_PORTS: '3100,54329'
      PAPERCLIP_API_URL: http://127.0.0.1:1
      PAPERCLIP_CHAT_SHARD_WORKERS: '3'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install fixed dependencies
        run: pnpm install --frozen-lockfile
      # Server fixtures use both the development daemon path and release cargo builds.
      # Build before timed test hooks; these binaries contain no model credentials.
      - name: Build Linux mock Runner prerequisites
        if: startsWith(matrix.label, 'server-')
        run: |
          cargo build --locked --manifest-path packages/paperclip-runner/runner/Cargo.toml -p paperclip-runner-core --bin paperclip-runnerd
          cargo build --release --locked --manifest-path packages/paperclip-runner/runner/Cargo.toml -p paperclip-runner-core --bin paperclip-runnerd
      - name: Verify assigned complete scope
        run: ${{ matrix.command }}
