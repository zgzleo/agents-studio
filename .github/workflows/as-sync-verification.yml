name: Agents Studio sync verification
on:
  push:
    branches: [sync/20261106-2f35eb108]
permissions:
  contents: read
concurrency:
  group: as-sync-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 19
      matrix:
        include:
          - label: typecheck-build
            command: "node scripts/typecheck-low-memory.mjs\npnpm build"
          - label: server-0
            command: "pnpm test:run:general -- --group general-server-without-chat-or-native-runner --shard-index 0 --shard-count 8"
          - label: server-1
            command: "pnpm test:run:general -- --group general-server-without-chat-or-native-runner --shard-index 1 --shard-count 8"
          - label: server-2
            command: "pnpm test:run:general -- --group general-server-without-chat-or-native-runner --shard-index 2 --shard-count 8"
          - label: server-3
            command: "pnpm test:run:general -- --group general-server-without-chat-or-native-runner --shard-index 3 --shard-count 8"
          - label: server-4
            command: "pnpm test:run:general -- --group general-server-without-chat-or-native-runner --shard-index 4 --shard-count 8"
          - label: server-5
            command: "pnpm test:run:general -- --group general-server-without-chat-or-native-runner --shard-index 5 --shard-count 8"
          - label: server-6
            command: "pnpm test:run:general -- --group general-server-without-chat-or-native-runner --shard-index 6 --shard-count 8"
          - label: server-7
            command: "pnpm test:run:general -- --group general-server-without-chat-or-native-runner --shard-index 7 --shard-count 8"
          - label: native-runner-0
            command: |
              pnpm run preflight:workspace-links
              pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
              python3 - <<'PYTHON'
              import json, subprocess
              inventory = json.loads(subprocess.check_output(['node', 'scripts/run-vitest-stable.mjs', '--mode', 'general', '--group', 'general-server-native-runner', '--dry-run'], text=True))
              files = inventory['selectedGeneralServerSuites'][0::2]
              assert files
              subprocess.run(['pnpm', 'exec', 'vitest', 'run', '--project', '@paperclipai/server', '--pool=forks', '--isolate', '--maxWorkers=1', '--no-file-parallelism', *files], check=True)
              PYTHON
          - label: native-runner-1
            command: |
              pnpm run preflight:workspace-links
              pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
              python3 - <<'PYTHON'
              import json, subprocess
              inventory = json.loads(subprocess.check_output(['node', 'scripts/run-vitest-stable.mjs', '--mode', 'general', '--group', 'general-server-native-runner', '--dry-run'], text=True))
              files = inventory['selectedGeneralServerSuites'][1::2]
              assert files
              subprocess.run(['pnpm', 'exec', 'vitest', 'run', '--project', '@paperclipai/server', '--pool=forks', '--isolate', '--maxWorkers=1', '--no-file-parallelism', *files], check=True)
              PYTHON
          - label: serialized-0
            command: "pnpm test:run:serialized -- --shard-index 0 --shard-count 2"
          - label: serialized-1
            command: "pnpm test:run:serialized -- --shard-index 1 --shard-count 2"
          - label: workspaces-a-0
            command: "pnpm test:run:general -- --group general-workspaces-a --shard-index 0 --shard-count 2"
          - label: workspaces-a-1
            command: "pnpm test:run:general -- --group general-workspaces-a --shard-index 1 --shard-count 2"
          - label: workspaces-b
            command: "pnpm test:run:general -- --group general-workspaces-b"
          - label: workspaces-c
            command: "pnpm test:run:general -- --group general-workspaces-c"
          - label: chat-0
            command: "pnpm test:run:general -- --group general-chat --shard-index 0 --shard-count 2"
          - label: chat-1
            command: "pnpm test:run:general -- --group general-chat --shard-index 1 --shard-count 2"
    env:
      PAPERCLIP_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      PAPERCLIP_TEST_POSTGRES_RESERVED_PORTS: '3100,54329'
      PAPERCLIP_API_URL: http://127.0.0.1:1
      PAPERCLIP_CHAT_SHARD_WORKERS: '3'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Initialize a stable isolated Cargo cache
        run: |
          mkdir -p "$RUNNER_TEMP/as-sync-cargo"
          printf 'CARGO_HOME=%s/as-sync-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install fixed dependencies
        run: pnpm install --frozen-lockfile
      # Server fixtures use both the development daemon path and release cargo builds.
      # Build before timed test hooks; these binaries contain no model credentials.
      - name: Build Linux mock Runner prerequisites
        if: startsWith(matrix.label, 'server-') || startsWith(matrix.label, 'native-runner-')
        run: |
          cargo build --locked --manifest-path packages/paperclip-runner/runner/Cargo.toml -p paperclip-runner-core --bins
          cargo build --release --locked --manifest-path packages/paperclip-runner/runner/Cargo.toml -p paperclip-runner-core --bins
      - name: Verify the exact warm release build used by the test hook
        if: startsWith(matrix.label, 'server-') || startsWith(matrix.label, 'native-runner-')
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          python3 - <<'PYTHON'
          import pathlib, subprocess, time
          root = pathlib.Path.cwd() / 'packages/paperclip-runner'
          started = time.monotonic()
          subprocess.run(['cargo', 'build', '--release', '--locked', '--manifest-path', str(root / 'runner/Cargo.toml'), '-p', 'paperclip-runner-core', '--bin', 'paperclip-runnerd'], cwd=root, check=True)
          print(f'::notice title=Warm Runner hook build::{time.monotonic() - started:.3f} seconds; fixed Cargo home; offline')
          PYTHON
      - name: Verify assigned complete scope
        env:
          CARGO_NET_OFFLINE: ${{ (startsWith(matrix.label, 'server-') || startsWith(matrix.label, 'native-runner-')) && 'true' || 'false' }}
        run: ${{ matrix.command }}
