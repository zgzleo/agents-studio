name: Agents Studio sync verification
on:
  push:
    branches: [sync/20261106-2f35eb108]
permissions:
  contents: read
concurrency:
  group: as-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PAPERCLIP_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      HEARTBEAT_SCHEDULER_ENABLED: 'false'
      PAPERCLIP_TEST_POSTGRES_RESERVED_PORTS: '3100,54329'
      PAPERCLIP_API_URL: http://127.0.0.1:1
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install fixed dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: node scripts/typecheck-low-memory.mjs
      - name: Unit and mock integration tests
        run: pnpm test:run
      - name: Build
        run: pnpm build
